# --- General & True Color ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1              # Start window numbering at 1
set -g pane-base-index 1         # Start pane numbering at 1
set -g renumber-windows on       # Auto-renumber windows when one closes
set -sg escape-time 0            # Remove delay when pressing Escape (great for Vim)

# --- Ergonomic Keybindings ---
# Remap prefix from Ctrl+b to Ctrl+a (or Ctrl+Space)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config quickly with Prefix + r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Intuitive splits that open in your current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- Aesthetics & Status Bar ---
set -g status-position top       # Put status bar at the top to declutter the bottom
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'

# Catppuccin theme options
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

